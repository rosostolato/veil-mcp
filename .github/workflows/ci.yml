name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install
        # setup-uv already created and activated a venv for this Python.
        run: uv pip install -e ".[dev]"
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Unit and integration tests
        run: uv run pytest -q

  security:
    # SPEC.md §37/§38: the adversarial suite gates every release. No warning-only mode.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Security suite
        run: uv run pytest tests/security -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install everything, including optional provider SDKs
        run: uv pip install -e ".[dev,gcp,firestore]" pip-audit cyclonedx-bom
      - name: Dependency vulnerability scan
        # The core has no runtime dependencies; this guards the dev and extra
        # sets. --skip-editable leaves out Veil itself, which is not on PyPI.
        run: uv run pip-audit --strict --skip-editable
      - name: SBOM
        run: uv run cyclonedx-py environment .venv --output-format json --outfile sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
