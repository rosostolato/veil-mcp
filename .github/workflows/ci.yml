name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Tests
        run: npm test

  security:
    # SPEC.md §37/§38: the adversarial suite gates every release. No warning-only mode.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Security suite
        run: npm run test:security

  package:
    # The bin only misbehaves once it is installed through npm's symlinks, so
    # the packaged artefact is exercised the way a user would get it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm pack
      - name: Install the tarball and start the server
        run: |
          mkdir -p /tmp/veil-package && cd /tmp/veil-package
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/veil-mcp-*.tgz
          ./node_modules/.bin/veil-mcp --version
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | VEIL_UI_PORT=0 VEIL_OPEN_BROWSER=false VEIL_ENABLED_ADAPTERS=env-file \
              ./node_modules/.bin/veil-mcp serve > out.json
          grep -q '"name":"veil"' out.json

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=moderate
      - name: SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
